services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly yes # 启用 AOF 持久化
      - --appendfsync everysec # 每秒同步一次
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    driver: local
