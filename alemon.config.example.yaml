# AgentLink 配置示例
#
# 用法：复制为 alemon.config.yaml，删除用不到的注释后按需修改。
# 字段含义、默认值与取值范围见 docs/config-reference.md；场景说明见 docs/config.md。
# 占位符统一写成 '<...>'：`agent-link doctor` 会识别为“未填写”，不会当成真实凭证。
# 所有时长单位为毫秒；名称以 Seconds / Days 结尾的除外。
#
# 最小可用（只填模型 Key，QQ 凭证留空时启动器显示扫码）：
#   alemonjs-agent-link:
#     apiKey: '<MODEL_API_KEY>'

# ---------------------------------------------------------------- 平台连接

# QQ 官方机器人（transport 为 qq-bot 时使用）。
qq-bot:
  app_id: '<QQ_APP_ID>'
  secret: '<QQ_APP_SECRET>'
  # 多机器人时改用 bots：键必须等于该机器人的 app_id，并指定 default_bot
  # bots:
  #   '102040992':
  #     secret: '<QQ_APP_SECRET>'
  # default_bot: '102040992'
  # 强制把 Markdown 转纯文本（气泡退化为文字，不推荐）
  # markdownToText: false
  # 客户端不支持内容的降级等级 0-4，0 时按钮与卡片显示最完整
  # hideUnsupported: 0

# OneBot（账号协议）：把 alemonjs-agent-link.transport 改成 onebot 才生效。
onebot:
  url: 'ws://127.0.0.1:3001'
  selfId: '1000000000'
  # 远程地址必须是 wss:// 且提供 accessToken
  accessToken: '<ONEBOT_TOKEN>'
  timeoutMs: 10000
  maxPayloadBytes: 8388608
  recordDirectory: '/absolute/path/to/records'
  imageDirectory: '/absolute/path/to/images'

# ---------------------------------------------------------------- 身份

# 平台用户 ID 或映射写成的主人；命中任一即视为主人。
master_id: '123456789'
# master_key:
#   1khucc5: true

# 机器人自身 ID，用于避免自问自答。
bot_id: '987654321'

# ---------------------------------------------------------------- 状态库（可选）

# 存在 db.redis 时，状态与额度默认走 Redis；没有 Redis 就保持注释，改用本地状态。
# db:
#   redis:
#     host: 127.0.0.1
#     port: 6379
#     password: ''
#     db: 0

# ---------------------------------------------------------------- 子应用

apps:
  xiuxian-game: false

# ---------------------------------------------------------------- 框架级过滤（可选）

# processor:
#   repeated_event_time: 60000   # 同一 MessageId 去重窗口
#   repeated_user_time: 1000     # 同一用户连续事件窗口
# disabled_selects:
#   message.update: true
# disabled_text_regular: '^\s*$'

# ---------------------------------------------------------------- AgentLink

alemonjs-agent-link:
  # ---- 模型 ----
  apiKey: '<MODEL_API_KEY>'
  # 兼容 OpenAI 的 HTTPS 地址；使用 DeepSeek 官方时可不填
  # baseUrl: 'https://api.deepseek.com'
  model: 'deepseek-v4-flash'
  provider: 'deepseek-official'
  profile: 'sdk'

  # ---- 多端点轮转（可选；不写则继续用上面的单 Key）----
  # modelPool:
  #   enabled: true
  #   strategy: weighted-round-robin # weighted-round-robin | least-busy | sticky
  #   maxAttempts: 3
  #   failureThreshold: 2
  #   cooldownSeconds: 60
  #   retryStatuses: [401, 402, 403, 429, 500, 502, 503, 504]
  #   endpoints:
  #     - id: ds-a
  #       provider: deepseek-official
  #       baseUrl: 'https://api.deepseek.com'
  #       apiKey: '<MODEL_API_KEY_A>'
  #       model: 'deepseek-v4-flash'
  #       weight: 1
  #       maxConcurrent: 2
  #       capabilities: [chat, tools, replyGate]
  #     - id: ds-b
  #       apiKeyEnv: 'DSH_MODEL_KEY_B' # 也可直接写 apiKey
  #       model: 'deepseek-v4-flash'
  #       weight: 1
  #       capabilities: [chat, tools, replyGate]

  # ---- 连接与运行 ----
  transport: 'qq-bot' # qq-bot | onebot，修改后需重启
  runtimeMode: 'auto' # auto | sandbox | chat-only
  # 不写时：有 db.redis 即 redis，否则 local
  # stateBackend: 'local'

  # ---- 开关 ----
  aiEnabled: true
  # aiDisabledReason: '维护中，稍后再试。'
  # aiNoticeEpoch: '2026-10-28'

  # ---- 人格 ----
  persona: 'dafeiyu' # assistant | dafeiyu
  # defaultSystemPrompt: '你是一个友好、可靠的助手。'

  # ---- 私聊 ----
  privateChatAccess: 'all' # owner | all；默认开放私聊，仍受额度和个人目录隔离限制
  privateAutoReply: true
  privateHistoryMaxTurns: 10
  privateHistoryTtlSeconds: 86400
  privateHistoryMaxChars: 12000

  # ---- 群唤醒 ----
  groupWakeNames: ['肥鱼', '大肥鱼', '帮我', '求助']

  # ---- 路径（默认在数据目录下；相对路径按本文件所在目录解析）----
  # workspaceRoot: './.data/agent-link/workspaces'
  # dshHomeRoot: './.data/agent-link/dsh-homes'
  # pythonExecutable: './.data/agent-link/venv/bin/python'
  # pythonPackageSources: ['https://pypi.org/simple']
  # bridgePort: 0              # 0 自动分配，固定端口需 ≥1024

  # ---- 输出与限额 ----
  maxMessageLength: 1000
  streamFlushIntervalMs: 500
  bubbleDelayMs: 250
  requestTimeoutMs: 120000
  startupTimeoutMs: 30000
  preparationTimeoutMs: 120000
  maxQueuedPerGroup: 3
  maxConcurrentRequests: 8
  maxActiveWorkers: 16
  maxCallsPerUserPerMinute: 6
  maxRequestBytes: 1048576
  retentionDays: 30 # 当前只接受 30

  # ---- 内容过滤 ----
  # inputBlockedKeywords: ['代开发票']
  # outputBlockedKeywords: ['<script']

  # ---- 近期群聊参考 ----
  recentChatMaxMessages: 20
  recentChatWindowSeconds: 900
  recentChatMaxChars: 6000
  recentChatSummaryMaxChars: 1600

  # ---- 额度（需要 db.redis）----
  budget:
    enabled: false
    personalDailyYuan: 1
    replyGateDailyYuan: 1
    globalDailyYuan: 0
    maxOutputTokens: 2048

  # ---- 接话判断用的小模型（可选，跨源时必须单独给 apiKey）----
  # replyGate:
  #   model: 'deepseek-flash'
  #   baseUrl: 'https://api.deepseek.com'
  #   apiKey: '<GATE_API_KEY>'

  # ---- 群聊参与策略 ----
  groupChat:
    enabled: true
    replyGateEnabled: true
    interjectChance: 0.25
    cooldownSeconds: 60
    maxPerHour: 10
    quietHours: [1, 8]
    timezone: 'Asia/Shanghai'
    interests: ['游戏', '猫', '奶茶']
    # 按群覆盖：键为群 ChannelId，可写任意策略字段
    # overrides:
    #   '123456789':
    #     interjectChance: 0
    #     quietHours: [0, 0]

  # ---- 模块 ----
  modules:
    # directory: './modules'
    disabled: []
    maxToolRounds: 8
    maxToolContinuations: 2
    settings:
      memory:
        automatic: true
        intervalHours: 12
        recallLimit: 8
      mood:
        baseline: 60
        halfLifeHours: 6
        modelJudge: true
      proactive:
        enabled: true
        autoSubscribe: true
        idleMinutes: 40
        minIntervalMinutes: 60
        maxIntervalMinutes: 180
        maxPerDay: 4
        quietHours: [23, 8]
        timezone: 'Asia/Shanghai'
        maxChars: 300
      expression:
        automatic: true
        voiceChance: 0.1
        stickerChance: 0.25
        delayMs: [0, 0]
      persona:
        # defaultId: 'editor'
        # commonRules: '称呼用户为“你”，不用敬语。'
        commonRules: ''
      stickers:
        autoCollect: true
        autoOwnerPrivate: true
        autoGroups: [] # 为空且 autoAllGroups 为 true 时收集所有群
        autoAllGroups: true
        autoLabel: true
        autoDetect: true
        autoQQSync: true
        autoMaxPerHour: 20
        panel:
          # 默认开启，仅绑定回环地址；未填 token 时自动写入数据目录的 sticker-panel-token.txt
          enabled: true
          port: 8787
      bili:
        enabled: true
        # 评论工具默认开放；主人本轮明确要求时才可调用，dryRun: true 可只预览
        allowComments: true
        allowProactiveBrowse: true
        dryRun: false
      qzone:
        enabled: true
        allowPost: true
        allowInteract: true
        dryRun: false
        visibility: 'friends'
      group-admin:
        allGroups: true
        groups: []

  # ---- 媒体 ----
  media:
    timeoutMs: 60000
    maxBytes: 10485760
    maxAttachments: 3
    ttsMaxChars: 800
    stickerCooldownSeconds: 30
    stickerMaxItems: 300
    # 空数组表示允许任意公网 HTTPS；填了就是精确域名白名单
    allowedHosts: []
    # 独立识图服务；不填时用 DSH 当前模型识图
    # vision:
    #   baseUrl: 'https://api.example.com/v1'
    #   apiKey: '<VISION_KEY>'
    #   model: '<VISION_MODEL>'
    # 语音转写（允许 http://localhost）
    # asr:
    #   baseUrl: 'https://api.example.com/v1'
    #   apiKey: '<ASR_KEY>'
    #   model: '<ASR_MODEL>'
    # 语音合成（允许 http://localhost）
    # tts:
    #   baseUrl: 'https://api.example.com/v1'
    #   apiKey: '<TTS_KEY>'
    #   model: '<TTS_MODEL>'
    #   voice: '<VOICE>'
    # 生图（允许 http://localhost）
    # imageGen:
    #   baseUrl: 'https://api.example.com/v1'
    #   apiKey: '<IMAGE_KEY>'
    #   model: '<IMAGE_MODEL>'
    #   size: '1024x1024'
    #   stylePrompt: ''
    #   ownerOnly: false
    # 语音引擎
    # speech:
    #   engine: 'auto'            # auto | system | edge | openai | cosyvoice | gptsovits | http
    #   fallback: true
    #   edgeVoice: 'zh-CN-XiaoyiNeural'
    #   speaker: '中文女'
    #   sampleRate: 22050
    #   language: 'zh'
